<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>スタイル</title>
  <style>
    strong {
      color: pink;
    }
  </style>
</head>

<body>
  <p>
  私の好きな食べ物は<strong>もも</strong>で、食べるだけで幸せな気持ちになる。
  また、私の趣味は<strong>サイクリング</strong>で、風景を見ながら走るのが楽しい。
</p>
</body>

</html>
